# Voices new words automatically: after a push to main that changes the word list, generates mp3 for words
# that don't have one yet (scripts/make_audio.py skips existing files) and commits audio/ + js/audio.js.
# That commit then deploys to Vercel like any other push. Can also be started by hand: Actions → Audio → Run workflow.
name: Audio

on:
  push:
    branches: [main]
    paths: [data/words.json, scripts/make_audio.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install edge-tts==7.3.1

      - run: python scripts/make_audio.py

      - name: Commit new audio
        run: |
          git add audio js/audio.js
          if git diff --cached --quiet; then echo "No new audio"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add audio for new words"
          # Someone may have pushed while we were generating — put our commit on top.
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
