  <script>
    // Telegram's Mini App SDK — only when opened inside Telegram (launch data in the hash, or a reload of such a page).
    (function () {
      var inTg = /tgWebApp/.test(location.hash) || window.TelegramWebviewProxy;
      try { inTg = inTg || sessionStorage.getItem("__telegram__initParams"); } catch (e) {}
      if (inTg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    })();
  </script>
